<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Shop</title>

    style.css
</head>

<body>

    <!-- LOGIN -->

    <div id="login" class="card">

        <h1>Virtual Shop</h1>

        <input
            id="email"
            type="email"
            placeholder="Email">

        <input
            id="password"
            type="password"
            placeholder="Password">

        <button onclick="login()">
            Login
        </button>

    </div>


    <!-- APP -->

    <div
        id="app"
        style="display:none;">

        <header>

            <h1>Virtual Shop</h1>

            <button
                class="logout-btn"
                onclick="logout()">

                Logout

            </button>

        </header>

   <!-- TIMER -->

	   <div class="card">

    <h2>Study Timer</h2>

    <div
        id="timer"
        class="balance">

        00:00:00

    </div>

    <button onclick="startTimer()">
        Start
    </button>

    <button onclick="pauseTimer()">
        Pause
    </button>

    <button onclick="resetTimer()">
        Reset
    </button>

    <button onclick="collectPoints()">
        Collect Coins
    </button>

</div>

        <!-- WALLET -->

        <div class="card">

            <h2>Your Wallet</h2>

            <div
                id="balance"
                class="balance">

                0 coins

            </div>

        </div>


        <!-- SHOP -->

        <div class="card">

            <h2>Shop</h2>

            <div id="shop">

            </div>

        </div>


        <!-- UNLOCKED CONTENT -->

        <div class="card">

            <h2>Unlocked Content</h2>

            <pre
                id="secretContent">

Nothing selected.

            </pre>

        </div>

    </div>


    <script type="module" src="app.js"></script>

</body>

</html>
