<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Study Well</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch to dark mode"><span aria-hidden="true">◐</span></button>
  <main class="page-container">
    <section id="login" class="login-screen" aria-labelledby="loginTitle">
      <div class="login-brand">
        <h1 id="loginTitle" class="wordmark">Study Well<sup>®</sup></h1>
        <p>Become a well of knowledge.</p>
        <a href="https://github.com/Amaury-BE/StudyWell/blob/main/StudyWell-Logo-Light.jpg" target="_blank" rel="noopener noreferrer">
          <img class="login-logo" src="https://raw.githubusercontent.com/Amaury-BE/StudyWell/main/StudyWell-Logo-Light.jpg" alt="Study Well logo">
        </a>
      </div>
      <form id="loginForm" class="login-form">
        <div><label class="sr-only" for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="Email" required></div>
        <div><label class="sr-only" for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password" required></div>
        <button type="submit">Log in</button>
      </form>
      <p id="loginMessage" class="message" role="status"></p>
    </section>
    <div id="app" hidden>
      <div id="waterProgress" class="water-progress" aria-hidden="true" hidden>
        <div class="water-surface water-surface-back"></div>
        <div class="water-surface water-surface-front"></div>
        <div class="water-body"></div>
      </div>
      <header class="app-header fixed-header">
        <a class="compact-brand" href="https://github.com/Amaury-BE/StudyWell/blob/main/StudyWell-Logo-Light.jpg" target="_blank" rel="noopener noreferrer">
          <img src="https://raw.githubusercontent.com/Amaury-BE/StudyWell/main/StudyWell-Logo-Light.jpg" alt="Study Well logo">
          <span class="wordmark">Study Well<sup>®</sup></span>
        </a>
        <div id="balance" class="balance" aria-label="Drop balance">
          <img class="drop-icon theme-drop-icon" src="https://raw.githubusercontent.com/Amaury-BE/StudyWell/main/Drop-Light.png" alt="">
          <span id="balanceValue">0</span>
        </div>
      </header>
      <div id="notification" class="notification" role="status" hidden></div>
      <section class="timer-panel" aria-labelledby="timerTitle">
        <h2 id="timerTitle" class="sr-only">Study timer</h2>
        <div id="timer" class="timer-display" aria-live="off">00:00:00</div>
        <p id="timerStatus" class="sr-only" role="status">Ready to study</p>
        <div class="timer-controls">
          <button id="toggleTimerButton" type="button">Start</button>
          <button id="resetTimerButton" type="button">Reset</button>
          <button id="collectPointsButton" type="button">Collect</button>
        </div>
        <p class="study-total">Total study time: <span id="study-time">0h 0m</span></p>
      </section>
      <section class="shop-card" aria-labelledby="shopTitle">
        <h2 id="shopTitle"><img class="cart-icon theme-cart-icon" src="https://raw.githubusercontent.com/Amaury-BE/StudyWell/main/Cart-Light.png" alt=""><span>Shop</span></h2>
        <div id="shop"></div>
      </section>
      <button id="logoutButton" class="logout-button" type="button">Log out</button>
    </div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
